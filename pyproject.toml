[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "parameterrun"
dynamic = ["version", "readme"]
description = "Parallel parameter sweeps with joblib/MPI and tqdm progress bars."
license = "BSD-3-Clause"
authors = [
    { name = "David Fernández-Fernández", email = "david.fernandezf@hotmail.com" }
]
requires-python = ">=3.11"
keywords = ["parallel", "parameter-sweep", "joblib", "mpi", "scientific-computing", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "joblib>=1.3",
    "tqdm>=4.66"
]

[project.urls]
Homepage = "https://github.com/Davtax/ParameterRun"
Documentation = "https://davtax.github.io/ParameterRun/"
Repository = "https://github.com/Davtax/ParameterRun"
Issues = "https://github.com/Davtax/ParameterRun/issues"
Changelog = "https://github.com/Davtax/ParameterRun/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mpi = [
    "mpi4py>=3.1"
]

[dependency-groups]
docs = [
    "zensical>=0.1",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.11",
]
bench = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
dev = [
    "parameterrun[mpi]",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.11",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=7",
    "pydevd-pycharm>=261.23567.174",
    "psutil>=7.2.2",
    "scalene>=2.2.1",
]

[tool.hatch.version]
path = "src/parameterrun/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/parameterrun"]

[tool.hatch.build.targets.sdist]
exclude = ["/logo"]

# README uses relative image paths (work on GitHub and in local previews); PyPI needs absolute URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="logo/'
replacement = '\1="https://raw.githubusercontent.com/Davtax/ParameterRun/main/logo/'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=parameterrun --cov-report=term-missing --cov-fail-under=70"
markers = [
    "mpi: tests that require mpi4py and an MPI launcher",
    "mpi_subprocess: tests that start their own mpiexec (skipped without one; never run them under mpiexec)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
