# Zensical reads this MkDocs-format config (https://zensical.org/docs/compatibility/mkdocs/).
site_name: parameterrun
site_description: Parallel parameter sweeps for Python with joblib/MPI and tqdm progress bars.
site_url: https://davtax.github.io/ParameterRun/
repo_url: https://github.com/Davtax/ParameterRun
repo_name: Davtax/ParameterRun
edit_uri: edit/dev/docs/
copyright: Copyright &copy; David Fernández-Fernández · BSD-3-Clause

theme:
  name: material
  logo: assets/icon-app-tile.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - User guide:
      - Parallel backends: guide/backends.md
      - Saving results and checkpoints: guide/results.md
      - Errors and validation: guide/errors.md
      - Progress bars: guide/progress.md
  - API reference: reference.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
