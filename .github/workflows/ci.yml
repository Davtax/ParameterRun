name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: non-mpi / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Sync environment
        run: uv sync

      - name: Tests
        run: uv run pytest -m "not mpi and not mpi_subprocess"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

  test-mpi:
    name: mpi / ${{ matrix.os }} / ${{ matrix.mpi }} / py3.12 / 4+8 ranks
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04's Open MPI 5.0.10 stalls on large TCP transfers/broadcasts in CI.
          # Keep the complete suite on the stable 24.04 Open MPI runtime; other Linux jobs stay on latest.
          - os: ubuntu-24.04
            mpi: openmpi
          - os: ubuntu-latest
            mpi: mpich
          - os: ubuntu-latest
            mpi: intelmpi
          - os: macos-latest
            mpi: openmpi
          - os: macos-latest
            mpi: mpich
          - os: windows-latest
            mpi: msmpi
          - os: windows-latest
            mpi: intelmpi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}

      - name: Install uv
        run: python -m pip install uv

      - name: Sync environment with MPI extra
        run: uv sync --extra mpi

      - name: Verify MPI runtime
        env:
          EXPECTED_MPI: ${{ matrix.mpi }}
        run: >-
          uv run python -c "import os; from mpi4py import MPI;
          print(MPI.Get_library_version());
          expected = {'openmpi': 'Open MPI', 'mpich': 'MPICH', 'intelmpi': 'Intel MPI', 'msmpi': 'Microsoft MPI'};
          assert MPI.get_vendor()[0] == expected[os.environ['EXPECTED_MPI']], MPI.get_vendor()"

      - name: MPI tests (4 ranks)
        run: uv run mpiexec -n 4 python -m pytest -m mpi -o addopts="-q -m mpi"

      - name: MPI scheduling and idle workers (8 ranks)
        run: uv run mpiexec -n 8 python -m pytest tests/test_mpi_rank_scaling.py -m mpi -o addopts="-q -m mpi"

      # Not under mpiexec: these tests start their own `mpiexec -n 4` (e.g. on_error="raise" must abort the job)
      - name: MPI subprocess tests
        run: uv run pytest -m mpi_subprocess -o addopts="-q -rs -m mpi_subprocess"
